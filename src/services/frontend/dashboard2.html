<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scooper Violation System | Computer Vision Monitor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emergency: { 500: '#ef4444', 950: '#450a0a' },
                        success: { 400: '#4ade80', 500: '#22c55e' }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; }
        .glass-panel { background: rgba(30,41,59,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(148,163,184,0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes flashRed { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} 50%{box-shadow:0 0 0 20px rgba(239,68,68,0.3)} }
        .violation-flash { animation: flashRed 0.6s ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Icon component
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const el = document.createElement('i');
                    el.setAttribute('data-lucide', name);
                    iconRef.current.appendChild(el);
                    lucide.createIcons({ attrs: { class: className, width: size, height: size }, nameAttr: 'data-lucide' });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        const ConnectionStatus = ({ connected }) => (
            <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/50">
                <div className={`w-2.5 h-2.5 rounded-full ${connected ? 'bg-success-500 animate-pulse' : 'bg-emergency-500'}`} />
                <span className={`text-xs font-medium ${connected ? 'text-success-400' : 'text-emergency-400'}`}>
                    {connected ? 'LIVE' : 'DISCONNECTED'}
                </span>
            </div>
        );

        const StatCard = ({ title, value, icon, color = "blue", subtitle }) => {
            const colors = {
                blue: "border-blue-500/30 text-blue-400",
                red: "border-emergency-500/30 text-emergency-400",
                green: "border-success-500/30 text-success-400",
                amber: "border-amber-500/30 text-amber-400",
            };
            return (
                <div className={`glass-panel rounded-xl p-5 border ${colors[color]}`}>
                    <div className="flex items-center justify-between mb-3">
                        <span className="text-slate-400 text-sm font-medium uppercase tracking-wider">{title}</span>
                        <Icon name={icon} size={20} />
                    </div>
                    <div className="text-3xl font-bold text-slate-100">{value}</div>
                    {subtitle && <div className="text-xs text-slate-500 mt-1">{subtitle}</div>}
                </div>
            );
        };

        const ScooperViolationDashboard = () => {
            const [connected, setConnected] = useState(false);
            const [violations, setViolations] = useState([]);
            const [totalViolations, setTotalViolations] = useState(0);
            const [detections, setDetections] = useState([]);
            const [isFlashing, setIsFlashing] = useState(false);
            const [fps, setFps] = useState(0);
            const [pendingTick, setPendingTick] = useState(0);
            
            // Use refs for ALL WebSocket and DOM-related state to prevent re-renders
            const imgRef = useRef(null);
            const wsRef = useRef(null);
            const reconnectTimerRef = useRef(null);
            const reconnectAttempts = useRef(0);
            const frameCountRef = useRef(0);
            const lastFrameTimeRef = useRef(Date.now());
            const violationOverlayRef = useRef(null);
            const pendingViolationsRef = useRef([]);
            const isProcessingViolation = useRef(false);

            // Fetch initial data
            useEffect(() => {
                let cancelled = false;
                const fetchData = async () => {
                    try {
                        const countRes = await fetch('http://localhost:8000/violations/count');
                        if (!cancelled && countRes.ok) {
                            const data = await countRes.json();
                            setTotalViolations(data.count || 0);
                        }
                        const incRes = await fetch('http://localhost:8000/violations?limit=5');
                        if (!cancelled && incRes.ok) {
                            const data = await incRes.json();
                            setViolations(Array.isArray(data) ? data : (data.violations || []));
                        }
                    } catch (e) {
                        console.error('Initial fetch failed:', e);
                    }
                };
                fetchData();
                return () => { cancelled = true; };
            }, []);

            // FPS counter
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = Date.now();
                    const elapsed = (now - lastFrameTimeRef.current) / 1000;
                    const count = frameCountRef.current;
                    setFps(elapsed > 0 ? Math.round(count / elapsed) : 0);
                    frameCountRef.current = 0;
                    lastFrameTimeRef.current = now;
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            // Process violations safely - batch them
            useEffect(() => {
                if (pendingViolationsRef.current.length === 0 || isProcessingViolation.current) return;
                
                isProcessingViolation.current = true;
                const batch = [...pendingViolationsRef.current];
                pendingViolationsRef.current = [];
                
                setViolations(prev => {
                    const combined = [...batch, ...prev].slice(0, 50);
                    return combined;
                });
                
                setIsFlashing(true);
                
                // Show overlay via DOM directly
                if (violationOverlayRef.current) {
                    violationOverlayRef.current.style.display = 'flex';
                }
                
                setTimeout(() => {
                    setIsFlashing(false);
                    if (violationOverlayRef.current) {
                        violationOverlayRef.current.style.display = 'none';
                    }
                    isProcessingViolation.current = false;
                }, 600);
            }, [pendingTick]); // Trigger when violations change to process pending

            // WebSocket connection - ONLY ONCE
            useEffect(() => {
                let isMounted = true;
                let ws = null;
                
                const connect = () => {
                    if (!isMounted) return;
                    if (ws?.readyState === WebSocket.OPEN || ws?.readyState === WebSocket.CONNECTING) return;
                    
                    try {
                        ws = new WebSocket('ws://localhost:8000/ws/stream');
                        wsRef.current = ws;

                        ws.onopen = () => {
                            if (!isMounted) { ws.close(); return; }
                            console.log('WS connected');
                            setConnected(true);
                            reconnectAttempts.current = 0;
                        };

                        ws.onmessage = (event) => {
                            if (!isMounted) return;
                            try {
                                const data = JSON.parse(event.data);
                                
                                // Update image DIRECTLY via DOM - never touches React state
                                if (data.type === 'frame' && data.frame && imgRef.current) {
                                    imgRef.current.src = `data:image/jpeg;base64,${data.frame}`;
                                    frameCountRef.current++;
                                }
                                
                                // Update detections (throttled to prevent rapid re-renders)
                                if (data.detections) {
                                    setDetections(data.detections);
                                }
                                
                                // Update count
                                if (data.violation_count !== undefined) {
                                    setTotalViolations(data.violation_count);
                                }
                                
                                // Handle violation - queue it instead of immediate state update
                                if (data.violation !== null && data.violation !== undefined) {
                                    const violation = {
                                        ...data.violation,
                                        timestamp: data.violation.timestamp || new Date().toISOString(),
                                        id: Date.now()
                                    };
                                    pendingViolationsRef.current.push(violation);
                                    // Force a re-render to trigger the batch processor
                                    setPendingTick(t => t + 1); 
                                }
                            } catch (e) {
                                console.error('WS message error:', e);
                            }
                        };

                        ws.onerror = (err) => {
                            console.error('WS error:', err);
                        };

                        ws.onclose = () => {
                            if (!isMounted) return;
                            console.log('WS disconnected');
                            setConnected(false);
                            wsRef.current = null;
                            
                            if (reconnectAttempts.current < 10) {
                                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts.current), 30000);
                                reconnectTimerRef.current = setTimeout(() => {
                                    reconnectAttempts.current++;
                                    connect();
                                }, delay);
                            }
                        };
                    } catch (e) {
                        console.error('WS create error:', e);
                    }
                };

                connect();

                return () => {
                    isMounted = false;
                    if (ws) ws.close();
                    if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
                };
            }, []); // EMPTY dependency array - runs ONCE

            return (
                <div className="h-screen w-screen bg-slate-950 flex flex-col overflow-hidden">
                    {/* Header */}
                    <header className="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-6 shrink-0 z-20">
                        <div className="flex items-center gap-4">
                            <div className="p-2 bg-emergency-500/10 rounded-lg border border-emergency-500/30">
                                <Icon name="shield-alert" size={24} className="text-emergency-500" />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold text-slate-100 tracking-tight">Scooper Violation System</h1>
                                <p className="text-xs text-slate-500">Computer Vision Hygiene Monitor</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <ConnectionStatus connected={connected} />
                            <div className="h-6 w-px bg-slate-700" />
                            <div className="flex items-center gap-2 text-xs text-slate-500">
                                <Icon name="clock" size={14} />
                                <span>{new Date().toLocaleTimeString()}</span>
                            </div>
                        </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden">
                        {/* Left Panel */}
                        <div className="flex-1 flex flex-col p-4 gap-4 min-w-0">
                            {/* Video Container */}
                            <div 
                                id="video-container"
                                className={`relative flex-1 rounded-2xl overflow-hidden bg-slate-900 border-2 transition-all duration-300 ${isFlashing ? 'border-emergency-500 shadow-[0_0_30px_rgba(239,68,68,0.3)]' : 'border-slate-700'}`}
                            >
                                <img 
                                    ref={imgRef}
                                    alt="Live Feed" 
                                    className="w-full h-full object-contain"
                                    style={{ display: 'block', minHeight: '100%' }}
                                />
                                
                                {/* Disconnected overlay */}
                                {!connected && (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/95 text-slate-600 z-10">
                                        <Icon name="video-off" size={48} className="mb-4 opacity-50" />
                                        <p className="text-lg font-medium">Waiting for video stream...</p>
                                        <p className="text-sm mt-1">ws://localhost:8000/ws/stream</p>
                                        <p className="text-xs mt-2 text-slate-500">Attempt {reconnectAttempts.current + 1}</p>
                                    </div>
                                )}
                                
                                {/* LIVE Badge */}
                                <div className="absolute top-4 left-4 flex items-center gap-2 px-3 py-1.5 rounded-lg bg-black/60 backdrop-blur-md border border-white/10 z-20">
                                    <div className={`w-2 h-2 rounded-full ${connected ? 'bg-red-500 animate-pulse' : 'bg-slate-500'}`} />
                                    <span className="text-xs font-mono text-white/90">LIVE</span>
                                </div>
                                
                                {/* Violation Overlay - DOM controlled, not React state */}
                                <div 
                                    ref={violationOverlayRef}
                                    className="absolute inset-0 flex items-center justify-center pointer-events-none bg-emergency-950/40 z-30"
                                    style={{ display: 'none' }}
                                >
                                    <div className="bg-emergency-950/90 backdrop-blur-sm border-2 border-emergency-500 rounded-xl p-6 text-center animate-pulse">
                                        <Icon name="alert-triangle" size={48} className="text-emergency-500 mx-auto mb-3" />
                                        <h3 className="text-2xl font-bold text-emergency-400">VIOLATION DETECTED</h3>
                                        <p className="text-slate-300 mt-2">Protein contact without scooper</p>
                                    </div>
                                </div>
                            </div>

                            {/* Stats Bar */}
                            <div className="grid grid-cols-4 gap-4 shrink-0">
                                <StatCard title="Total Violations" value={totalViolations} icon="alert-octagon" color="red" subtitle="All time count" />
                                <StatCard title="Active Detections" value={detections.length} icon="scan-eye" color="blue" subtitle="Objects in frame" />
                                <StatCard title="Compliance Rate" value={`${Math.max(0, 100 - (totalViolations * 2))}%`} icon="check-circle-2" color="green" subtitle="Estimated" />
                                <StatCard title="Stream FPS" value={fps} icon="activity" color="amber" subtitle="Frames per second" />
                            </div>
                        </div>

                        {/* Right Sidebar */}
                        <div className="w-96 border-l border-slate-800 bg-slate-900/50 flex flex-col shrink-0">
                            {/* Live Detections */}
                            <div className="p-4 border-b border-slate-800">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-sm font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                                        <Icon name="scan-line" size={16} /> Live Detections
                                    </h3>
                                    <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 font-mono">{detections.length}</span>
                                </div>
                                <div className="space-y-2 max-h-48 overflow-y-auto scrollbar-hide">
                                    {detections.length === 0 ? (
                                        <div className="text-center py-4 text-slate-600 text-sm">No detections</div>
                                    ) : (
                                        detections.map((det, idx) => (
                                            <div key={idx} className="flex items-center justify-between p-3 rounded-lg bg-slate-800/50 border border-slate-700/50">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-2 h-2 rounded-full ${det.label?.toLowerCase().includes('hand') ? 'bg-emergency-500' : det.label?.toLowerCase().includes('scoop') ? 'bg-success-500' : 'bg-blue-500'}`} />
                                                    <span className="text-sm text-slate-300 font-medium">{det.label || det.class || 'Unknown'}</span>
                                                </div>
                                                <span className="text-xs text-slate-500 font-mono">{Math.round((det.confidence || 0.95) * 100)}%</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Recent Incidents */}
                            <div className="flex-1 flex flex-col p-4 overflow-hidden">
                                <div className="flex items-center justify-between mb-3 shrink-0">
                                    <h3 className="text-sm font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                                        <Icon name="history" size={16} /> Recent Incidents
                                    </h3>
                                    <span className="text-xs px-2 py-0.5 rounded-full bg-emergency-500/20 text-emergency-400 font-mono">{pendingTick}</span>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2 scrollbar-hide pr-1">
                                    {pendingTick === 0 ? (
                                        <div className="flex flex-col items-center justify-center h-full text-slate-600">
                                            <Icon name="shield-check" size={32} className="mb-2 opacity-50" />
                                            <p className="text-sm">No violations recorded</p>
                                        </div>
                                    ) : (
                                        violations.map((incident, idx) => (
                                            <div key={incident.id || idx} className="flex items-start gap-3 p-3 rounded-lg bg-emergency-950/30 border border-emergency-500/20">
                                                <div className="p-1.5 bg-emergency-500/20 rounded-md mt-0.5">
                                                    <Icon name="alert-circle" size={14} className="text-emergency-400" />
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <p className="text-sm text-slate-300 font-medium truncate">{incident.message || "Protein contact without scooper"}</p>
                                                    <div className="flex items-center gap-2 mt-1">
                                                        <span className="text-xs text-slate-500">{new Date(incident.timestamp).toLocaleTimeString()}</span>
                                                        <span className="text-xs text-emergency-400/80 font-mono">Zone: {incident.zone || 'A'}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* System Status */}
                            <div className="p-4 border-t border-slate-800 bg-slate-900/80">
                                <div className="space-y-3">
                                    <div className="flex items-center justify-between text-xs">
                                        <span className="text-slate-500">WebSocket Status</span>
                                        <span className={connected ? 'text-success-400' : 'text-emergency-400'}>{connected ? 'Connected' : 'Disconnected'}</span>
                                    </div>
                                    <div className="flex items-center justify-between text-xs">
                                        <span className="text-slate-500">Last Update</span>
                                        <span className="text-slate-400">{new Date().toLocaleTimeString()}</span>
                                    </div>
                                    <div className="flex items-center justify-between text-xs">
                                        <span className="text-slate-500">Endpoint</span>
                                        <span className="text-slate-400 font-mono">localhost:8000</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScooperViolationDashboard />);
    </script>
</body>
</html>
